[project]
name = "ai-platform"
version = "0.1.0"
description = "Modular AI Knowledge Platform"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Settings & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # Database — async SQLAlchemy + pgvector
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.2",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",

    # LLM providers
    "openai>=1.40.0",
    "anthropic>=0.34.0",

    # AWS
    "boto3>=1.35.0",
    "aioboto3>=13.0.0",

    # Document loaders
    "pypdf>=4.3.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "openpyxl>=3.1.0",

    # Text processing
    "tiktoken>=0.7.0",
    "langchain-text-splitters>=0.2.0",

    # HTTP client
    "httpx>=0.27.0",

    # AWS Lambda ASGI adapter
    "mangum>=0.17.0",

    # CLI
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.scripts]
rag-demo = "apps.rag_demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiplatform", "apps"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "factory-boy>=3.3.0",
    "faker>=26.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["aiplatform", "apps", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "E501",
    "B008",  # Depends() in default args is the correct FastAPI DI pattern
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["aiplatform", "apps"]
omit = ["*/migrations/*", "*/tests/*"]
